<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Trip Split</title>
<meta name="theme-color" content="#1f3b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Split">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm, practical. A travel journal you trust with money.
   IDEA: a sunset over red-rock country with the road running to the horizon; the balance sits on a card like a ticket on the dash.
   PICTURE: an illustrated outback scene heads every screen (a night sky with stars in dark mode).
   COLOUR and TYPE: ochre and red rock, sunset peach, teal for money coming back, each person a colour of their own. Overpass, from road-sign lettering.
   LAYOUT: one column up to 720px, a floating balance card, pill tabs, soft cards, a bottom sheet for entry. */
:root{color-scheme:light dark;
  --bg:light-dark(#f6f0e7,#14100d);--ink:light-dark(#2a1d15,#f3ebe1);--muted:light-dark(#7b6a5c,#ab9d8e);
  --card:light-dark(#fffdf9,#201914);--line:light-dark(#ebe1d3,#342a22);--soft:light-dark(#f0e6d8,#2a211b);
  --ochre:light-dark(#b4441e,#e07a4f);--onochre:#fff7ef;--teal:light-dark(#1f7a7f,#5cc4c4);--red:light-dark(#b4441e,#f08a62);
  --shadow:light-dark(0 1px 2px rgba(80,40,10,.06),0 1px 2px rgba(0,0,0,.4));--lift:light-dark(0 10px 30px rgba(90,40,10,.12),0 10px 30px rgba(0,0,0,.45));
  --sky1:light-dark(#e98d5c,#0f1428);--sky2:light-dark(#f8d6a6,#3b2738);--sun:light-dark(#fff3d6,#f1e3c3);--hill3:light-dark(#d9895f,#3b2422);--hill2:light-dark(#b4441e,#5a2716);--hill1:light-dark(#8d3418,#2a1510);--road:light-dark(#3a2f29,#100c0a);--dash:#f2c14e;--star:light-dark(transparent,rgba(255,255,255,.85));--hdr:light-dark(#3a160a,#fbeee2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Overpass,system-ui,sans-serif;overflow-x:clip;padding-bottom:120px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:21px;font-weight:800;margin-bottom:12px}
.top{position:relative;overflow:hidden;color:var(--hdr);min-height:270px;isolation:isolate}
.top.tm{min-height:280px}
.fab[hidden]{display:none}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.topin{max-width:720px;margin:0 auto;padding:18px max(5vw,18px) 0}
.top h1{font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:-.015em}
.top .sub{margin:6px 0 0;max-width:30em;font-size:16px;opacity:.85}
.back{color:inherit;opacity:.8;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:6px 0;margin-bottom:4px}
.back::before{content:"‹";font-size:20px;line-height:1}
.hcard{position:relative;max-width:720px;margin:-40px auto 0;padding:0 max(5vw,18px)}
.hcard>div{background:var(--card);border-radius:22px;box-shadow:var(--lift);padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.lab{font-size:14px;font-weight:600;color:var(--muted)}
.big{font-size:clamp(36px,9vw,48px);font-weight:800;line-height:1;white-space:nowrap;letter-spacing:-.02em;margin-top:4px}
.big.pos{color:var(--teal)}.big.neg{color:var(--red)}
.mini{display:flex;gap:20px;margin:0}.mini dt{font-size:12px;color:var(--muted);font-weight:600}.mini dd{margin:0;font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.band{padding:22px max(5vw,18px);max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
.empty{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:32px 22px;text-align:center}
.empty h2{margin-bottom:6px}
.tabs{display:flex;gap:4px;margin:18px auto 0;max-width:calc(720px - 2*max(5vw,18px));width:calc(100% - 2*max(5vw,18px));background:var(--soft);border-radius:999px;padding:4px}
.tabs button{flex:1;background:none;border:0;border-radius:999px;padding:10px 6px;font:700 15px Overpass,sans-serif;color:var(--muted);min-height:44px;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-current=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;margin:22px 4px 8px}
.day:first-child{margin-top:0}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.exp{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 16px;cursor:pointer;min-height:68px}
.exp:active{background:var(--soft)}
.exp:focus-visible,.btn:focus-visible,.chip:focus-visible,.trip:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ed b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed small,.amt small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.amt{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--teal)}.neg{color:var(--red)}
.av{--c:#b4441e;flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font:800 16px Overpass,sans-serif;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.av.sm{width:30px;height:30px;font-size:13px}.av.xs{width:22px;height:22px;font-size:11px;box-shadow:none}
.trip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;color:inherit;text-decoration:none;margin-bottom:10px}
.trip .tico{grid-row:span 2;width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--hill2) 55%);position:relative;overflow:hidden}
.trip .tico::after{content:"";position:absolute;left:50%;bottom:0;width:26px;height:18px;transform:translateX(-50%);background:var(--road);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.trip b{font-size:17px}.trip span{color:var(--muted);font-size:14px;grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip .cur{grid-column:3;grid-row:1/span 2;font-weight:700;font-size:13px;background:var(--soft);color:var(--ink);padding:4px 10px;border-radius:999px}
.stackf{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:16px Overpass,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}
.btn{font:700 15px Overpass,sans-serif;border-radius:14px;padding:12px 18px;min-height:48px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--ochre);border-color:transparent;color:var(--onochre);box-shadow:0 4px 14px color-mix(in srgb,var(--ochre) 35%,transparent)}
.btn.teal{background:var(--teal);border-color:transparent;color:light-dark(#fff,#06272c)}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.55}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(20px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:10px;font:800 16px Overpass,sans-serif;background:var(--ochre);color:var(--onochre);border:0;border-radius:999px;padding:10px 22px 10px 10px;box-shadow:0 10px 28px color-mix(in srgb,var(--ochre) 45%,transparent);cursor:pointer;z-index:5}
.fab .plus{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:22px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px Overpass,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px 6px 6px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:color-mix(in srgb,var(--teal) 14%,var(--card));border-color:var(--teal)}
.chip.on::after{content:"✓";color:var(--teal);font-weight:800;margin-left:-2px}
.who .chip{font-size:18px;padding:8px 20px 8px 8px}.who .chip .av{width:34px;height:34px}
.sheet{position:fixed;inset:0;background:rgba(30,14,6,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:620px;max-height:94vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px max(4vw,18px) calc(24px + env(safe-area-inset-bottom));box-shadow:var(--lift)}
.panel::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph h2{margin:0}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);width:44px;height:44px;cursor:pointer;border-radius:50%}
.two,.amtrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.amtrow{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
#f-amount{font-size:28px;font-weight:800;letter-spacing:-.01em}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-weight:700;font-size:14px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;font:700 13px Overpass,sans-serif;color:var(--muted);border-radius:10px;min-height:40px;cursor:pointer;padding:0 2px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 48px;align-items:center;gap:10px;font-weight:600}
.prow em{font-style:normal;color:var(--muted);font-size:14px}
.prow input{text-align:right}
.hint{margin:0;color:var(--muted);font-size:14px}
.hint b{color:var(--ink)}
.err{margin:0;color:var(--red);font-weight:700;min-height:1em}
.acts{display:flex;gap:10px;justify-content:space-between}.acts .primary{flex:1}
.quick{display:flex;gap:8px}
.file{position:relative;width:100%;border-style:dashed}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rprev{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.rprev img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.rprev>span{flex:1}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:4px 16px}
.bal{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.bal+.bal{border-top:1px solid var(--line)}
.bal .whois{display:flex;align-items:center;gap:8px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{height:10px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar i.pos{left:50%;background:var(--teal)}.bar i.neg{right:50%;background:var(--red)}
.bar::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:var(--line)}
.pay{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 0}
.pay+.pay{border-top:1px solid var(--line)}
.pay .amt{margin-left:auto;font-size:17px}
.flow{display:flex;align-items:center;gap:8px}.flow .arr{color:var(--muted);font-weight:800}
.flow .txt{margin-left:4px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0}
.rrow b{white-space:nowrap}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.inline3{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:8px}
.note{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:15px}
.note ol{margin:6px 0 0;padding-left:20px}
.sec+.sec{margin-top:30px}
.viewer img{width:100%;border-radius:14px;display:block}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;box-shadow:var(--lift)}
.toast.show{opacity:1;transform:translateX(-50%)}
.item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;display:grid;gap:8px}
.chips.sm .chip{font-size:14px;padding:6px 12px;min-height:38px}
.chip.all{border-style:dashed;color:var(--muted)}
.scan{font-size:14px}.scan.busy{color:var(--teal);font-weight:700;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.igrid{overflow-x:auto;border-radius:16px;background:var(--card);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.igrid table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.igrid th,.igrid td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.igrid tbody tr:last-child td{border-bottom:2px solid var(--line)}
.igrid tfoot th,.igrid tfoot td{border-bottom:0}
.igrid thead th{font-weight:700;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;padding-top:10px}
.igrid thead .mc .av{display:grid;margin:0 auto 3px}
.igrid .ic{position:sticky;left:0;background:var(--card);z-index:1;min-width:132px;text-align:left;padding-left:10px}
.igrid .pc{min-width:76px;width:76px}.igrid .mc{width:50px;min-width:50px;text-align:center}.igrid .dc{width:36px;min-width:36px}
.igrid .mc span{display:block;max-width:50px;overflow:hidden;text-overflow:ellipsis}
.igrid input{min-height:40px;padding:8px;font-size:16px}.igrid .iprice{text-align:right}
.cell{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font:700 12px Overpass,sans-serif;color:var(--muted);display:inline-grid;place-items:center;transition:background .12s,border-color .12s}
.cell.on{background:var(--teal);border-color:var(--teal)}
.cell.on:not(.all)::after{content:"";width:12px;height:7px;border:solid light-dark(#fff,#06272c);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.cell.all.on{color:light-dark(#fff,#06272c)}
.cell:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.igrid .x{width:36px;height:40px;font-size:24px}
.igrid tfoot th{font-size:13px;color:var(--muted);font-weight:700}
.igrid .tot{font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.linkbox input{font-size:14px;color:var(--muted)}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;z-index:6;max-width:92vw;text-align:center}
.sync[hidden]{display:none}

.ro{background:var(--soft);color:var(--ink);cursor:default}
.igrid .xrow td{background:color-mix(in srgb,var(--soft) 55%,var(--card))}
.igrid .xrow .ic{font-weight:700;font-size:14px}.igrid .xrow .ic small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
.igrid .xnote{font-size:13px;color:var(--muted);padding-left:10px}.igrid .iextra{text-align:right}
.igrid .nc{position:sticky;left:0;background:var(--card);z-index:2;width:34px;min-width:34px;padding:6px 0 6px 8px;text-align:center;color:var(--muted);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.igrid .ic{left:34px;padding-left:4px}
/* Item grid: name and price share one cell */
.igrid .ic{min-width:250px}
.icell{display:flex;gap:8px;align-items:center}
.icell .iname{flex:1;min-width:110px}
.ip{display:flex;gap:2px;align-items:center;flex:none}
.ip .iprice,.ip .iextra{width:82px}
.ip .x,.ip .xsp{width:32px;height:40px;font-size:22px;flex:none}
.xl{flex:1;font-weight:700;font-size:14px}.xl small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.3}
@media(max-width:600px){
  .panel{padding:0 10px}
  .igrid th,.igrid td{padding:4px 1px}
  .igrid .nc{width:20px;min-width:20px;padding:4px 0 4px 4px;font-size:12px}
  .igrid .ic{left:20px;min-width:0;width:112px;max-width:112px;padding:4px 4px 4px 2px}
  .icell{flex-direction:column;align-items:stretch;gap:4px}
  .icell .iname{min-width:0}
  .igrid input{min-height:36px;padding:6px 7px}
  .ip .iprice,.ip .iextra{width:auto;flex:1;min-width:0}
  .ip .x,.ip .xsp{width:26px;height:36px;font-size:20px}
  .igrid .mc{width:30px;min-width:30px;max-width:30px}
  .igrid thead th{vertical-align:bottom;padding-bottom:6px}
  .igrid thead .mc .av{width:18px;height:18px;font-size:10px;margin-bottom:4px}
  .igrid .mn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;height:62px;max-height:62px;text-align:start;max-width:none!important;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .igrid thead .ic{font-size:11px}
  .cell{width:27px;height:27px;border-radius:8px;font-size:9px}
  .cell.on:not(.all)::after{width:9px;height:5px;border-width:0 0 2.5px 2.5px}
  .igrid .tot{font-size:10px;letter-spacing:-.02em}
  .igrid .xnote{font-size:11px;padding-left:4px}
  .xl{font-size:13px}.xl small{font-size:11px}
}
/* Full-screen editor */
.sheet{align-items:stretch;backdrop-filter:none}
.panel{max-width:none;height:100%;max-height:none;border-radius:0;padding:0 max(4vw,18px);box-shadow:none}
.panel::before{display:none}
.ph,#ef,.viewer{max-width:960px;margin-inline:auto}
.ph{position:sticky;top:0;z-index:3;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#ef{padding-bottom:0}
.acts{position:sticky;bottom:0;z-index:3;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:4px}
.viewer{padding-bottom:24px}
@media(prefers-reduced-motion:reduce){.toast,.tabs button,.cell,input{transition:none}.scan.busy{animation:none}}
@media(max-width:600px){.prow{grid-template-columns:minmax(0,1fr) 96px 44px}.inline3{grid-template-columns:86px minmax(0,1fr) auto}.bal{grid-template-columns:minmax(0,6.5em) minmax(0,1fr) auto}.seg button{font-size:12px}}
@media(max-width:600px){.panel{padding:0 10px}}
@media(max-width:600px){
  .igrid .nc{width:16px;min-width:16px;padding:4px 0 4px 2px}
  .igrid .ic{left:16px;width:152px;max-width:152px;padding:4px 3px 4px 2px}
  .icell{flex-direction:row;align-items:center;gap:3px}
  .icell .iname{flex:1;min-width:0;padding:6px 6px}
  .ip{gap:0}
